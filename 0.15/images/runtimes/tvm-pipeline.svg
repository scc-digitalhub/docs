<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c"/>
    </marker>
  </defs>

  <!-- background, so the picture reads well in light and dark themes -->
  <rect x="1" y="1" width="758" height="578" rx="14" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

  <!-- vertical flow -->
  <line x1="170" y1="130" x2="170" y2="186" stroke="#78909c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="270" x2="170" y2="326" stroke="#78909c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="410" x2="170" y2="466" stroke="#78909c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- artifacts -->
  <rect x="40" y="50" width="260" height="80" rx="12" fill="#f5f7fa" stroke="#90a4ae" stroke-width="2"/>
  <text x="170" y="82" text-anchor="middle" font-size="19" font-weight="700" fill="#263238">Source model</text>
  <text x="170" y="110" text-anchor="middle" font-size="15" fill="#546e7a">ONNX · TFLite</text>

  <rect x="40" y="190" width="260" height="80" rx="12" fill="#f5f7fa" stroke="#90a4ae" stroke-width="2"/>
  <text x="170" y="222" text-anchor="middle" font-size="19" font-weight="700" fill="#263238">Relax IR</text>
  <text x="170" y="250" text-anchor="middle" font-size="15" fill="#546e7a">Model &lt;function&gt;-ir</text>

  <rect x="40" y="330" width="260" height="80" rx="12" fill="#f5f7fa" stroke="#90a4ae" stroke-width="2"/>
  <text x="170" y="362" text-anchor="middle" font-size="19" font-weight="700" fill="#263238">Compiled model.so</text>
  <text x="170" y="390" text-anchor="middle" font-size="15" fill="#546e7a">Model &lt;function&gt;-&lt;tag&gt;</text>

  <rect x="40" y="470" width="260" height="80" rx="12" fill="#e8f5e9" stroke="#66bb6a" stroke-width="2"/>
  <text x="170" y="502" text-anchor="middle" font-size="19" font-weight="700" fill="#1b5e20">Inference service</text>
  <text x="170" y="530" text-anchor="middle" font-size="15" fill="#2e7d32">REST 8080 · gRPC 9000</text>

  <!-- actions, on the arrows -->
  <rect x="75" y="143" width="190" height="34" rx="17" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="170" y="166" text-anchor="middle" font-size="15" fill="#6d4c41"><tspan font-weight="700" fill="#e65100">build</tspan> · Job</text>

  <rect x="55" y="283" width="230" height="34" rx="17" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="170" y="306" text-anchor="middle" font-size="15" fill="#6d4c41"><tspan font-weight="700" fill="#e65100">compile</tspan> · Job per target</text>

  <rect x="45" y="423" width="250" height="34" rx="17" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="170" y="446" text-anchor="middle" font-size="15" fill="#6d4c41"><tspan font-weight="700" fill="#e65100">serve</tspan> · Deployment</text>

  <!-- the function that links the steps -->
  <rect x="440" y="20" width="290" height="410" rx="12" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  <text x="585" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#0d47a1">Function · kind tvm</text>

  <line x1="300" y1="90" x2="458" y2="90" stroke="#64b5f6" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="300" y1="230" x2="458" y2="230" stroke="#64b5f6" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="300" y1="370" x2="458" y2="370" stroke="#64b5f6" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="460" y="62" width="250" height="56" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="2"/>
  <text x="585" y="86" text-anchor="middle" font-size="16" font-weight="700" font-family="Roboto Mono, Consolas, monospace" fill="#0d47a1">model</text>
  <text x="585" y="107" text-anchor="middle" font-size="13" fill="#1565c0">set by you</text>

  <rect x="460" y="202" width="250" height="56" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="2"/>
  <text x="585" y="226" text-anchor="middle" font-size="16" font-weight="700" font-family="Roboto Mono, Consolas, monospace" fill="#0d47a1">ir_model</text>
  <text x="585" y="247" text-anchor="middle" font-size="13" fill="#1565c0">written by build, read by compile</text>

  <rect x="460" y="342" width="250" height="56" rx="8" fill="#ffffff" stroke="#64b5f6" stroke-width="2"/>
  <text x="585" y="366" text-anchor="middle" font-size="16" font-weight="700" font-family="Roboto Mono, Consolas, monospace" fill="#0d47a1">so_model</text>
  <text x="585" y="387" text-anchor="middle" font-size="13" fill="#1565c0">written by compile, read by serve</text>
</svg>
