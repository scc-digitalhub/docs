INHERIT: ../base.yml
site_url: http://docs/sdk

extra:
  portal_name: SDK
  portal_path: "/sdk"

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/open-details-on-anchor.js

extra_css:
  - stylesheets/cards.css
  - stylesheets/tables.css
  - !ENV [
      OTHERS_STYLESHEETS_PORTAL_SELECTION,
      "../stylesheets/portal_selection.css",
    ]
  - !ENV [OTHERS_STYLESHEETS_COLORS, "../stylesheets/colors.css"]

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight:
      { anchor_linenums: true, line_spans: __span, pygments_lang_class: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - md_in_html

plugins:
  - search: {}
  - macros: { render_by_default: false }
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_toc_entry: false
            show_labels: false

theme:
  features:
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.select

nav:
  - Index: index.md
  - Tutorials:
      - Getting Started: tutorials/index.md
      - First Python function: tutorials/quickstart.md
      - Data Processing & Transformation:
          - ETL Data Processing: tutorials/etl-data-processing.md
          - Database Transformation with DBT: tutorials/dbt-transformation.md
      - Machine Learning:
