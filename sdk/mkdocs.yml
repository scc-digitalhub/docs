INHERIT: ../base.yml
site_url: http://docs/sdk

extra:
  portal_name: SDK

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

extra_css:
  - stylesheets/cards.css
  - !ENV [
      OTHERS_STYLESHEETS_PORTAL_SELECTION,
      "../stylesheets/portal_selection.css",
    ]
  - !ENV [OTHERS_STYLESHEETS_COLORS, "../stylesheets/colors.css"]

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight:
      { anchor_linenums: true, line_spans: __span, pygments_lang_class: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - md_in_html

plugins:
  - search: {}
  - redirects:
      redirect_maps:
        how-to/quickstart.md: tutorials/quickstart.md
        how-to/runtime-guide.md: explanations/choosing-a-runtime.md
        how-to/what-can-i-do.md: explanations/what-can-i-do.md
        reference/runtimes/container/how-to.md: explanations/runtimes/container-execution.md
        reference/runtimes/dbt/how-to.md: explanations/runtimes/dbt-execution.md
        reference/runtimes/flower/how-to.md: explanations/runtimes/flower-execution.md
        reference/runtimes/hera/how-to.md: explanations/runtimes/hera-execution.md
        reference/runtimes/modelserve/how-to.md: explanations/runtimes/modelserve-execution.md
        reference/runtimes/servicegraph/how-to.md: explanations/runtimes/servicegraph-execution.md
        reference/runtimes/python/python/how-to.md: explanations/runtimes/python-execution.md
        reference/runtimes/python/openinference/how-to.md: explanations/runtimes/openinference-execution.md
        reference/runtimes/python/guardrail/how-to.md: explanations/runtimes/guardrail-execution.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_toc_entry: false
            show_labels: false

theme:
  features:
    - navigation.path
    - navigation.top
    - content.code.copy
    - content.code.select

nav:
  - Index: index.md
  - Tutorials:
      - Getting Started: tutorials/index.md
      - First Python function: tutorials/quickstart.md
      - Data Processing & Transformation:
          - ETL Data Processing: tutorials/etl-data-processing.md
          - Database Transformation with DBT: tutorials/dbt-transformation.md
      - Machine Learning:
          - Scikit-Learn Model Training: tutorials/scikit-learn-model.md
          - MLflow Model Management: tutorials/mlflow-model.md
          - Custom ML Models with Darts: tutorials/custom-ml-model.md
      - AI & Large Language Models:
          - Large Language Models: tutorials/llm-model.md
  - How-to Guides:
      - Guides: how-to/index.md
      - Installation: how-to/installation.md
      - Kubernetes guide: how-to/kubernetes.md
  - Explanations:
      - Overview: explanations/index.md
      - What can I do?: explanations/what-can-i-do.md
      - Data and artifacts: explanations/data-and-artifacts.md
      - Choosing a runtime: explanations/choosing-a-runtime.md
      - Runtime execution models:
          - Python: explanations/runtimes/python-execution.md
          - OpenInference: explanations/runtimes/openinference-execution.md
          - Guardrail: explanations/runtimes/guardrail-execution.md
          - DBT: explanations/runtimes/dbt-execution.md
          - Container: explanations/runtimes/container-execution.md
          - Hera: explanations/runtimes/hera-execution.md
          - ModelServe: explanations/runtimes/modelserve-execution.md
