markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

site_name: Digital Hub

extra:
  site: https://scc-digitalhub.github.io/docs
  docs_version: !ENV [DOCS_VERSION, 'current']
  versions: !ENV [VERSIONS]
  stable_version: !ENV [STABLE_VERSION]
  n_display_versions: !ENV [N_DISPLAY_VERSIONS, 4]
  portals:
    - name: User
      path: ""
    - name: Admin
      path: "/admin"
    - name: Tutorials
      path: "/tutorials"
    - name: SDK
      path: "/sdk"

theme:
  name: material
  custom_dir: ../custom/
  features:
    # - navigation.expand
    - navigation.path
    - content.code.copy
    - content.code.select
  palette:
    # Palette toggle for light mode
    - scheme: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
